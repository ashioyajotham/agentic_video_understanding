name: avu-rapid-crossing-showcase
status: confidential-eap
source_evaluation:
  task: rapid-crossing-order
  primary_attempts_per_mode: 3
  observed:
    agentic_exact: 3
    static_exact: 0
    task_specific_agentic_provider_latency_delta_percent: -55.7
  evidence_policy: reference-parent-artifacts-do-not-copy-or-rewrite
showcase:
  semantic_task: recover the order in which colored objects cross the reference line
  prompt: rapid_crossing/prompt.txt
  canonical_benchmark:
    suite: data/tasks/phase4_tracking_ablation.jsonl
    generator: src/avu_eval/synthetic.py
    export_dir: showcase/generated_canonical_phase4
    exact_render_required: true
    claim_evidence: eligible-only-after-registered-model-run
  demo_suite:
    spec: showcase/rapid_crossing/variants_hard.json
    generator: showcase/rapid_crossing/generate_variants.py
    render: 960x540-stochastic-seeded
    claim_evidence: false
    purpose: visual-demonstration-and-exploration
  historical_results:
    registered_controls: showcase/generated
    hard_suite: showcase/generated_hard
    needle_suite: showcase/generated_needle
    mutation_policy: preserve-do-not-relabel-as-phase4
validation:
  repetitions_per_mode: 3
  modes:
    - static
    - agentic
  timeout_seconds: 180
  counterbalance: true
  primary_and_diagnostic_runs_separate: true
release:
  embargo: until-explicitly-lifted-by-google
  public_export_required: true
  remove_before_publication:
    - unreleased model identifiers
    - authorized project identifiers
    - private SDK locations
    - raw confidential service traces
