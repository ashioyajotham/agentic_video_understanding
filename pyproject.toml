[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avu-eval"
version = "0.1.0"
description = "Paired static-vs-agentic evaluation harness for video understanding"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "Pillow>=10"]

[project.scripts]
avu-eval = "avu_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

