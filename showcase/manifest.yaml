      static_mean_semantic: 0.320
      agentic_mean_semantic: 0.893
      static_mean_provider_latency_seconds: 11.452
      agentic_mean_provider_latency_seconds: 15.376
      static_mean_total_tokens: 2470.375
      agentic_mean_total_tokens: 9071.250
      agentic_processing_observed: 24
      combined_hard_exact_per_mode: 0
  demo_suite:
